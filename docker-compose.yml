# Backends: one OpenSearch node shared by the three corpora (indexes are
# namespaced by name) and one Neo4j server per corpus, because
# ingest/build_indexes.py clears the whole graph before it builds one.
#
# Passwords are read from the environment; the defaults are placeholders.
#     export NEO4J_PASSWORD=...          # also read by config.py
#     export OPENSEARCH_INITIAL_ADMIN_PASSWORD=...
#     docker compose up -d
services:
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      - discovery.type=single-node
      # Exactly one way of disabling security. The entrypoint translates
      # DISABLE_SECURITY_PLUGIN into -Eplugins.security.disabled=true, so also
      # passing plugins.security.disabled as an environment variable sets it
      # twice and OpenSearch refuses to start.
      - DISABLE_SECURITY_PLUGIN=true
      # The k-NN field's HNSW graphs need more heap than the default, and
      # OpenSearch dies quietly on OOM.
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-change-me}
    ulimits:
      memlock: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - os-data:/usr/share/opensearch/data

  # au corpus (bolt 7687, NEO4J_URI in corpora/au/corpus.py).
  neo4j:
    image: neo4j:5-community
    environment:
      # NEO4J_AUTH only takes effect when the data volume is empty.
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-change-me}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

  # uk corpus (bolt 7688, NEO4J_URI in corpora/uk/corpus.py).
  neo4j-uk:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-change-me}
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4j-uk-data:/data

  # us corpus (bolt 7689, NEO4J_URI in corpora/us/corpus.py).
  neo4j-us:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-change-me}
    ports:
      - "7476:7474"
      - "7689:7687"
    volumes:
      - neo4j-us-data:/data

volumes:
  os-data:
  neo4j-data:
  neo4j-uk-data:
  neo4j-us-data:
